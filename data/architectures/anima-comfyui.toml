# Generated from verified official output by phase0/gen_arch_defs.py -- do not hand-edit.
# Anima in the ComfyUI-native layout, from Extended's pattern_dict.

name = "anima-comfyui"
layout = "comfyui-native"
format_version = "0.5.0"
threads_per_block = [512]
bytes_per_thread = 8
source = "github.com/mingyi456/ComfyUI-DFloat11-Extended pattern_dict.py @ 414506d"

# ComfyUI key conversion, as in the real releases (FINDINGS).
[keys]
strip_prefix = ["net."]
drop = ['^accum_', '\._extra_state$', '^pos_embedder\.(seq|dim_spatial_range|dim_temporal_range)$']

[[unit]]
pattern = 't_embedder\.1'
attrs = [
    "linear_1",
    "linear_2",
]

[[unit]]
pattern = 'blocks\.\d+'
attrs = [
    "self_attn.q_proj",
    "self_attn.k_proj",
    "self_attn.v_proj",
    "self_attn.output_proj",
    "cross_attn.q_proj",
    "cross_attn.k_proj",
    "cross_attn.v_proj",
    "cross_attn.output_proj",
    "mlp.layer1",
    "mlp.layer2",
    "adaln_modulation_self_attn.1",
    "adaln_modulation_self_attn.2",
    "adaln_modulation_cross_attn.1",
    "adaln_modulation_cross_attn.2",
    "adaln_modulation_mlp.1",
    "adaln_modulation_mlp.2",
]

[[unit]]
pattern = 'llm_adapter\.embed'
# empty: the matched module is itself one tensor
attrs = []

[[unit]]
pattern = 'llm_adapter\.blocks\.\d+'
attrs = [
    "self_attn.q_proj",
    "self_attn.k_proj",
    "self_attn.v_proj",
    "self_attn.o_proj",
    "cross_attn.q_proj",
    "cross_attn.k_proj",
    "cross_attn.v_proj",
    "cross_attn.o_proj",
    "mlp.0",
    "mlp.2",
]
