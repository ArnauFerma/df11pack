[package]
name = "df11pack"
version.workspace = true
description = "Fast, byte-identical DFloat11 compressor for BF16 models (LLMs, diffusers, ComfyUI)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
df11-codec = { path = "../df11-codec" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
df11-fixtures = { path = "../df11-fixtures" }
